name: Build Hugo (blog_src) → gh-pages/blogs

on:
  push:
    branches: [ blog_update ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true    # 若用主题子模块，必须；用 Modules 留着也不碍事
          fetch-depth: 0

      # 仅当你用 Hugo Modules 时保留这段
      - name: Hugo Modules vendor
        run: |
          cd blog_src
          hugo mod get -u
          hugo mod vendor

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build from ./blog_src
        run: hugo --gc --minify -s ./blog_src

      - name: Deploy to gh-pages/blogs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./blog_src/public
          destination_dir: blogs
          # 如果 gh-pages 历史“脏”或被保护规则影响，临时打开：
          # force_orphan: true
