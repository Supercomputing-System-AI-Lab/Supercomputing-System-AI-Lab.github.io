name: Build Hugo (blog_src) and deploy to gh-pages/blogs

on:
  push:
    branches: [ main ]   # 你在哪个分支改 blog_src，填哪个

permissions:
  contents: write        # 允许推送到同仓库的 gh-pages 分支

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true     # 若你的主题使用 SCSS/SASS，需要设置 true

      - name: Build site from ./blog_src
        run: |
          hugo --gc --minify -s ./blog_src

      - name: Deploy to gh-pages/blogs
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./blog_src/public
          publish_branch: gh-pages
          destination_dir: blogs
          github_token: ${{ secrets.GITHUB_TOKEN }}
