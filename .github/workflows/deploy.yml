name: Build Hugo (blog_src) → gh-pages/blogs

on:
  push:
    branches: [ blog_update ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true       # 主题是子模块时需要；留着也不影响
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest' # 可固定具体版本
          extended: true

      # 【仅当你使用 Hugo Modules 引入主题时保留；否则删掉这步】
      - name: Hugo Modules vendor
        working-directory: blog_src
        run: |
          hugo mod get -u
          hugo mod vendor
      # ↑ hugo mod 是 Hugo 自带子命令，必须在安装 Hugo 之后才能用。:contentReference[oaicite:1]{index=1}

      - name: Build from ./blog_src
        run: hugo --gc --minify -s ./blog_src

      # 可选：便于调试构建结果
      - name: Upload built site (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: hugo-public-${{ github.run_number }}
          path: ./blog_src/public
          retention-days: 3
      # ↑ 这样你能在 Actions 页直接下载 public/ 检查是不是空白。:contentReference[oaicite:2]{index=2}

      - name: Deploy to gh-pages/blogs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./blog_src/public
          destination_dir: blogs
          # 首次/历史脏时可打开，之后删掉
          # force_orphan: true
      # ↑ 该 Action 原生支持把站点发布到发布分支的子目录（destination_dir）。:contentReference[oaicite:3]{index=3}
